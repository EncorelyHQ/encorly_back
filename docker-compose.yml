# Infra local. Uso: cp .env.example .env (completa DB_PASSWORD y JWT_SIGNING_KEY) && docker compose up -d
name: encorely

services:
  postgres:
    image: postgres:16-alpine
    container_name: encorely-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-encorely}
      POSTGRES_USER: ${DB_USER:-encorely}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - encorely_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      retries: 20

volumes:
  encorely_pg:
