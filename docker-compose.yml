# Infra local.
#   Solo BD (desarrollo con `dotnet run`):  docker compose up -d
#   BD + API en contenedor (sin SDK):        docker compose --profile full up -d --build
# Antes: cp .env.example .env y completa DB_PASSWORD, JWT_SIGNING_KEY y (opcional) DEMO_USER_PASSWORD.
name: encorely

services:
  postgres:
    image: postgres:16-alpine
    container_name: encorely-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-encorely}
      POSTGRES_USER: ${DB_USER:-encorely}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - encorely_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      retries: 20

  api:
    profiles: [full]
    build: .
    container_name: encorely-api
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_MIGRATE_ON_STARTUP: "true"
      # Development: el .env local trae DB_SSL_MODE=Prefer (postgres:16-alpine no tiene TLS) y no hay proxy ni URL pública,
      # que Production exige. appsettings.Development.json escucha en 0.0.0.0:5000.
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "5000:5000"

volumes:
  encorely_pg:
