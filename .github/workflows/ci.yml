name: CI

on:
  push:
    branches: [main, rebuild/v1]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restaurar
        run: dotnet restore Encorely.slnx

      - name: Compilar (warnings = errores)
        run: dotnet build Encorely.slnx --no-restore -c Release

      # Postgres real con Testcontainers (Docker viene en el runner). Incluye el test que exige
      # que contracts/openapi.v1.json esté al día con el código.
      - name: Tests
        run: dotnet test tests/Encorely.Tests --no-build -c Release

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Construir imagen
        run: docker build -t encorely-api:ci .
