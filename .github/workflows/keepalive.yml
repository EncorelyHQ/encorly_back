name: keepalive

# Mantiene despierta la API de Render (plan Free se duerme a los 15 min sin uso).
# Horario: 08:00-22:00 hora Colombia (13:00-03:00 UTC), cada 10 minutos.
# Fuera de ese horario la API se duerme sola y ahorra horas del plan gratis.
# Para demos fuera de horario: Actions > keepalive > Run workflow.
on:
  schedule:
    - cron: "*/10 13-23,0-2 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: GET /health/ready
        run: curl --fail --silent --show-error --max-time 90 --retry 2 --retry-delay 10 https://encorely-api.onrender.com/health/ready
