# Infra local para desarrollo/demo. El docker-compose.yml original apunta al
# esquema de Supabase; este levanta Postgres con esquema + seed reconstruidos.
# Uso: docker compose -f docker-compose.local.yml --env-file .env up -d
name: encorely-local

services:
  postgres:
    image: postgres:16-alpine
    container_name: encorely-local-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # El back fuerza `SSL Mode=Require`: copiamos el cert autofirmado con el
    # owner/permisos que Postgres exige antes de arrancar.
    entrypoint:
      - sh
      - -c
      - >-
        mkdir -p /etc/pg-ssl && cp /certs/server.crt /certs/server.key /etc/pg-ssl/ &&
        chown postgres:postgres /etc/pg-ssl/* && chmod 600 /etc/pg-ssl/server.key &&
        exec docker-entrypoint.sh postgres -c ssl=on -c ssl_cert_file=/etc/pg-ssl/server.crt -c ssl_key_file=/etc/pg-ssl/server.key
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - encorely_local_pg:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db/certs:/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    container_name: encorely-local-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: encorely-local-kafka
    ports:
      - "${KAFKA_PORT}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_PORT}'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      retries: 30

volumes:
  encorely_local_pg:
